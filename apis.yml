aid: biotheryx
name: BioTheryX
description: 'BioTheryX is a private, clinical-stage biopharmaceutical company headquartered
  in San Diego, California, discovering and developing first-in-class targeted protein
  degraders — both bifunctional degraders and molecular glues — for cancer and inflammatory
  disease. Its proprietary PRODEGY platform is built on Cereblon-binding expertise
  carried over from founders who worked on FDA-approved Cereblon modulators. The lead
  program BTX-9341, a dual CDK4/CDK6 degrader, is in Phase 1 for HR+/HER2- breast cancer,
  alongside BTX-10908 targeting SOS1 for pan-KRAS mutant cancers and PDE4 degraders
  for inflammatory conditions; the company also partners with Incyte on molecular glue
  degrader discovery. BioTheryX is a therapeutics developer with no public developer
  program: probes on 2026-08-02 returned 404 for /openapi.json, /swagger.json, /api-docs,
  /llms.txt and every /.well-known/ discovery path on biotheryx.com, and there is no
  api./developer./docs./portal. subdomain, GitHub organization, or published SDK.'
